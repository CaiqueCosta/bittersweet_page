<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bittersweet Release Notes</title>
    <meta name="description" content="Read Bittersweet release notes.">
    <link rel="icon" href="assets/bittersweet-icon.png">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-page="release-notes">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Bittersweet home">
        <img src="assets/bittersweet-icon.png" alt="">
        <span>Bittersweet</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="./">Home</a>
        <a href="archive.html">Archive</a>
        <a href="https://github.com/CaiqueCosta/bittersweet">GitHub</a>
      </nav>
    </header>

    <main class="page-shell">
      <div class="page-heading">
        <p class="eyebrow">Changelog</p>
        <h1>Release Notes</h1>
        <p>Release notes are generated from GitHub Releases so download links and notes stay aligned.</p>
      </div>

      <section class="notes-list" data-release-notes-list aria-live="polite">
        <p class="muted">Loading release notes...</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Bittersweet</span>
      <a href="https://github.com/CaiqueCosta/bittersweet/releases">All GitHub releases</a>
    </footer>

    <script src="assets/site.js"></script>
  </body>
</html>
